services:
  frontui:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: frontui_app
    # hostname: yourhostname <- optional
    volumes:
      - $PWD/db/:/etc/front-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      FRONTUI_ENABLE_FAIL2BAN: "true"
    tty: true
    network_mode: host
    restart: unless-stopped
